<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phần mềm quản lý đoàn viên công đoàn</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="logo" aria-hidden="true">CĐ</div>
      <div>
        <div class="org" id="org-name">Công đoàn</div>
        <div class="sub">Phần mềm quản lý đoàn viên</div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Phần mềm quản lý đoàn viên công đoàn</h1>
      <a id="open-app" class="btn-open" href="#" rel="noopener">Mở phần mềm quản lý đoàn viên</a>
      <p id="config-warning" class="warn" hidden>
        Trang này chưa được cấu hình địa chỉ phần mềm. Người vận hành cần điền <code>webAppUrl</code> trong tệp <code>docs/config.js</code>.
      </p>
    </section>
  </main>

  <script src="./config.js"></script>
  <script>
    (function () {
      var cfg = window.APP_CONFIG || {};
      var url = String(cfg.webAppUrl || '').trim();
      var link = document.getElementById('open-app');
      var valid = /^https:\/\/script\.google\.com\/(a\/macros\/[A-Za-z0-9.\-]+|macros)\/s\/[A-Za-z0-9_\-]+\/exec$/.test(url);
      if (valid && cfg.embed === true) {
        document.body.className = 'embed';
        while (document.body.firstChild) document.body.removeChild(document.body.firstChild);
        var frame = document.createElement('iframe');
        frame.src = url;
        frame.title = 'Phần mềm quản lý đoàn viên';
        frame.setAttribute('allow', 'clipboard-write');
        document.body.appendChild(frame);
        if (cfg.orgName) document.title = cfg.orgName + ' — Quản lý đoàn viên';
        return;
      }
      if (valid) { link.href = url; }
      else { link.classList.add('disabled'); link.setAttribute('aria-disabled', 'true'); link.removeAttribute('href'); document.getElementById('config-warning').hidden = false; }
      if (cfg.orgName) { document.getElementById('org-name').textContent = cfg.orgName; document.title = cfg.orgName + ' — Quản lý đoàn viên'; }
    })();
  </script>
</body>
</html>
