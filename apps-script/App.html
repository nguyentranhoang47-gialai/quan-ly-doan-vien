/* ============================ TIỆN ÍCH DOM ============================ */
function h(tag, props) {
  const el = document.createElement(tag);
  const kids = Array.prototype.slice.call(arguments, 2);
  if (props) {
    Object.keys(props).forEach(function (k) {
      const v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'open') el[k] = !!v;
      else el.setAttribute(k, v === true ? '' : String(v));
    });
  }
  append(el, kids);
  return el;
}
function append(el, kids) {
  (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
    if (Array.isArray(c)) return append(el, c);
    if (c === null || c === undefined || c === false) return;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  });
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

function fmtDate(s) { return s && /^\d{4}-\d{2}-\d{2}/.test(s) ? s.substring(8, 10) + '/' + s.substring(5, 7) + '/' + s.substring(0, 4) : (s || ''); }

function money(n) { return (n === null || n === undefined || n === '') ? '' : Number(n).toLocaleString('vi-VN') + ' đ'; }
function todayVN() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
  const g = function (t) { return p.filter(function (x) { return x.type === t; })[0].value; };
  return g('year') + '-' + g('month') + '-' + g('day');
}

function newRid() {
  const b = new Uint8Array(12);
  (window.crypto || window.msCrypto).getRandomValues(b);
  return 'R' + Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');

function appErr(code, message, details) { const e = new Error(message); e.code = code; e.details = details || null; return e; }

/** Gọi máy chủ qua google.script.run. requestId bắt buộc với thao tác ghi (chống xử lý lặp). */
function call(action, payload, requestId) {
  return new Promise(function (resolve, reject) {
    if (!(window.google && google.script && google.script.run)) {
      reject(appErr('INTERNAL', 'Không kết nối được máy chủ. Hãy mở phần mềm bằng đường dẫn Web App chính thức.'));
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) return resolve(res.data);
        const er = res && res.error ? res.error : { code: 'INTERNAL', message: 'Lỗi không xác định. Vui lòng thử lại.' };
        const e = appErr(er.code, er.message, er.details);
        if (e.code === 'AUTH' && S.token && action.indexOf('auth.') !== 0) { sessionExpired(e.message); }
        reject(e);
      })
      .withFailureHandler(function () {
        reject(appErr('NETWORK', 'Không nhận được phản hồi từ máy chủ (mạng yếu hoặc máy chủ chậm). Kiểm tra kết nối rồi bấm lại — thao tác sẽ không bị ghi trùng.'));
      })
      .api({ token: S.token, action: action, payload: payload || {}, requestId: requestId || '' });
  });
}

/** Khóa nút trong khi xử lý (chống bấm gửi lặp), hiện vòng quay. */
function busy(btn, fn) {
  if (btn && btn.disabled) return Promise.resolve();
  const old = btn ? Array.prototype.slice.call(btn.childNodes) : null;
  if (btn) { btn.disabled = true; clear(btn); append(btn, [h('span', { class: 'spinner', 'aria-hidden': 'true' }), ' Đang xử lý…']); }
  return Promise.resolve().then(fn).finally(function () { if (btn) { btn.disabled = false; clear(btn); append(btn, old); } });
}

function toast(msg, type) {
  const el = h('div', { class: 'msg ' + (type || '') , text: msg });

  setTimeout(function () { el.remove(); }, type === 'error' ? 7000 : 4000);
}
function alertBox(type, msg) { return h('div', { class: 'alert ' + type, role: type === 'error' ? 'alert' : 'status', text: msg }); }

/* ============================ HỘP THOẠI ============================ */
function openDialog(title, opts) {
  opts = opts || {};
  const body = h('div', { class: 'body' });
  const footer = h('footer');
  const msg = h('div');
  const closeBtn = h('button', { class: 'close', 'aria-label': 'Đóng', text: '×' });
  const dlg = h('div', { class: 'dialog' + (opts.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('header', null, h('h2', { text: title }), closeBtn), h('div', { class: 'msgbox' }, msg), body, footer);
  const overlay = h('div', { class: 'overlay' }, dlg);
  function close() { overlay.remove(); document.removeEventListener('keydown', onKey); if (opts.onClose) opts.onClose(); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('mousedown', function (e) { if (e.target === overlay && !opts.modal) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(overlay);
  setTimeout(function () { const f = dlg.querySelector('input,select,textarea,button.btn'); if (f) f.focus(); }, 30);
  return {
    body: body, footer: footer, close: close,
    error: function (e) { clear(msg); if (e) { msg.appendChild(alertBox('error', errorText(e))); dlg.scrollIntoView({ block: 'start' }); } },
    info: function (type, text) { clear(msg); if (text) msg.appendChild(alertBox(type, text)); }
  };
}
function confirmDialog(title, text, okLabel, danger) {
  return new Promise(function (resolve) {
    let done = false;
    const d = openDialog(title, { onClose: function () { if (!done) resolve(false); } });
    d.body.appendChild(h('p', { text: text }));
    d.footer.appendChild(h('button', { class: 'btn', text: 'Không', onclick: function () { d.close(); } }));
    d.footer.appendChild(h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), text: okLabel || 'Đồng ý',
      onclick: function () { done = true; d.close(); resolve(true); } }));
  });
}

/* ============================ BIỂU MẪU ============================ */
/** Ô ngày dạng dd/mm/yyyy (không dùng Date của trình duyệt để tránh lệch múi giờ). */
function dateInput(id, value) {
  const inp = h('input', { id: id, type: 'text', inputmode: 'numeric', placeholder: 'dd/mm/yyyy', maxlength: '10', autocomplete: 'off', value: fmtDate(value) });
  inp.addEventListener('input', function (e) {
    if (e.inputType && e.inputType.indexOf('delete') === 0) return;
    let v = inp.value.replace(/[^\d]/g, '').substring(0, 8);
    if (v.length >= 5) v = v.substring(0, 2) + '/' + v.substring(2, 4) + '/' + v.substring(4);
    else if (v.length >= 3) v = v.substring(0, 2) + '/' + v.substring(2);
    inp.value = v;
  });
  return inp;
}
let fieldSeq = 0;
/**
 * Tạo biểu mẫu từ định nghĩa. def: {name,label,type,options,required,hint,full,readonly}
 * Trả về { el(name), get(), showErrors(details), clearErrors() }.
 */
function makeForm(defs, values) {
  values = values || {};
  const parts = {};
  defs.forEach(function (d) {
    const id = 'f' + (++fieldSeq) + '_' + d.name;
    let input;
    const v = values[d.name] === undefined || values[d.name] === null ? (d.default === undefined ? '' : d.default) : values[d.name];
    if (d.type === 'select') {
      input = h('select', { id: id, disabled: d.readonly });
      (d.options || []).forEach(function (o) { input.appendChild(h('option', { value: o[0], text: o[1] })); });
      input.value = v;
    } else if (d.type === 'textarea') input = h('textarea', { id: id, maxlength: d.max || 1000, readonly: d.readonly, value: v });
    else if (d.type === 'date') input = dateInput(id, v);
    else if (d.type === 'checkbox') input = h('input', { id: id, type: 'checkbox', checked: v === true || v === 'true' });
    else input = h('input', { id: id, type: d.type || 'text', inputmode: d.inputmode, maxlength: d.max || 200, readonly: d.readonly,
      placeholder: d.placeholder, autocomplete: d.autocomplete || 'off', value: v });
    const err = h('div', { class: 'err', id: id + '_err' });
    input.setAttribute('aria-describedby', id + '_err');
    const wrap = d.type === 'checkbox'
      ? h('div', { class: 'field' }, h('label', { style: 'font-weight:600;display:flex;gap:8px;align-items:center' }, input, d.label), d.hint ? h('div', { class: 'hint', text: d.hint }) : null, err)
      : h('div', { class: 'field' + (d.full ? ' full' : '') }, h('label', { for: id }, d.label, d.required ? h('span', { class: 'req', text: ' *' }) : null),
        input, d.hint ? h('div', { class: 'hint', text: d.hint }) : null, err);
    parts[d.name] = { def: d, input: input, wrap: wrap, err: err };
  });
  return {
    el: function (name) { return parts[name] ? parts[name].wrap : null; },
    get: function () {
      const o = {};
      Object.keys(parts).forEach(function (k) {
        const p = parts[k];
        o[k] = p.def.type === 'checkbox' ? p.input.checked : String(p.input.value || '').trim();
      });
      return o;
    },
    clearErrors: function () { Object.keys(parts).forEach(function (k) { parts[k].wrap.classList.remove('invalid'); parts[k].err.textContent = ''; }); },
    showErrors: function (details) {
      this.clearErrors();
      let first = null;
      Object.keys(details || {}).forEach(function (k) {
        const p = parts[k] || (k === 'unit_code' ? parts.unit_id : null);
        if (!p) return;
        p.wrap.classList.add('invalid'); p.err.textContent = details[k];
        if (!first) first = p.input;
      });
      if (first) first.focus();
    }
  };
}
function opts(obj) { return Object.keys(obj).map(function (k) { return [k, obj[k]]; }); }
function unitOptions(filterFn, emptyLabel) {
  const list = (S.me.units || []).filter(filterFn || function () { return true; }).map(function (u) { return [u.unit_id, u.path]; });
  return emptyLabel ? [['', emptyLabel]].concat(list) : list;
}

function downloadText(filename, text, type) {
  const blob = new Blob([text], { type: type || 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename, style: 'display:none' });
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Phương án dự phòng nếu trình duyệt chặn tải tệp trong khung ứng dụng: mở tệp ở thẻ mới.
  const msg = h('div', { class: 'msg' }, 'Đã tạo tệp ' + filename + '. ',
    h('a', { href: url, target: '_blank', rel: 'noopener', download: filename, style: 'color:#fff;text-decoration:underline', text: 'Không thấy tệp? Bấm vào đây.' }));
  $('toast').appendChild(msg);
  setTimeout(function () { msg.remove(); }, 15000);
  setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
}

/** Đọc CSV theo RFC 4180: ngoặc kép, "" trong ô, xuống dòng trong ô, bỏ BOM; tự nhận dấu , hoặc ; */
function parseCsv(text) {
  text = String(text || '').replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const sep = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  const rows = []; let row = []; let cell = ''; let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
/* CSV-PARSER-END */

function renderLogin(message) {
  const app = clear($('app'));
  const box = h('div', { class: 'login' });
  const card = h('div', { class: 'card' });
  const msg = h('div');
  if (message) msg.appendChild(alertBox('info', message));
  const email = h('input', { id: 'login-email', type: 'email', autocomplete: 'email', inputmode: 'email', placeholder: 'ten@coquan.vn', maxlength: '120' });
  const sendBtn = h('button', { class: 'btn primary big', type: 'submit', text: 'Gửi mã đăng nhập', style: 'width:100%' });
  const step1 = h('form', { novalidate: true },
    h('div', { class: 'field' }, h('label', { for: 'login-email', text: 'Email được cấp quyền' }), email,
      h('div', { class: 'hint', text: 'Hệ thống sẽ gửi mã 6 chữ số tới email này.' })), sendBtn);
  step1.addEventListener('submit', function (e) {
    e.preventDefault();
    clear(msg);
    const v = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { msg.appendChild(alertBox('error', 'Email chưa đúng định dạng. Ví dụ: ten@coquan.vn')); email.focus(); return; }
    busy(sendBtn, function () {
      return call('auth.requestOtp', { email: v }).then(function (r) { showStep2(v, r.message); })
        .catch(function (err) { msg.appendChild(alertBox('error', errorText(err))); });
    });
  });
  function showStep2(addr, info) {
    clear(card); clear(msg); msg.appendChild(alertBox('ok', info));
    const otp = h('input', { id: 'login-otp', class: 'otp-input', type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '••••••' });
    otp.addEventListener('input', function () { otp.value = otp.value.replace(/\D/g, '').substring(0, 6); });
    const okBtn = h('button', { class: 'btn primary big', type: 'submit', text: 'Đăng nhập', style: 'width:100%' });
    const f2 = h('form', { novalidate: true },
      h('p', null, 'Email: ', h('strong', { text: addr })),
      h('div', { class: 'field' }, h('label', { for: 'login-otp', text: 'Mã đăng nhập (6 chữ số)' }), otp), okBtn,
      h('div', { class: 'row', style: 'margin-top:14px' },
        h('button', { class: 'btn', type: 'button', text: 'Đổi email', onclick: function () { renderLogin(); } }),
        h('span', { class: 'spacer' }),
        h('button', { class: 'btn', type: 'button', text: 'Gửi lại mã', onclick: function (e) {
          const b = e.currentTarget;
          busy(b, function () { return call('auth.requestOtp', { email: addr }).then(function (r) { clear(msg); msg.appendChild(alertBox('ok', r.message)); })
            .catch(function (err) { clear(msg); msg.appendChild(alertBox('error', errorText(err))); }); });
        } })));
    f2.addEventListener('submit', function (e) {
      e.preventDefault(); clear(msg);
      if (!/^\d{6}$/.test(otp.value)) { msg.appendChild(alertBox('error', 'Hãy nhập đủ 6 chữ số trong email.')); otp.focus(); return; }
      busy(okBtn, function () {
        return call('auth.verifyOtp', { email: addr, otp: otp.value }).then(function (r) {
          S.token = r.token; store.set(r.token); return startApp();
        }).catch(function (err) { msg.appendChild(alertBox('error', errorText(err))); otp.select(); });
      });
    });
    append(card, [h('div', { class: 'logo-big', 'aria-hidden': 'true', text: 'CĐ' }), h('h1', { text: 'Nhập mã đăng nhập' }), msg, f2]);
    otp.focus();
  }
  append(card, [h('div', { class: 'logo-big', 'aria-hidden': 'true', text: 'CĐ' }), h('h1', { text: 'Đăng nhập phần mềm quản lý đoàn viên' }), msg, step1]);
  append(box, card);
  box.appendChild(h('p', { class: 'muted', style: 'text-align:center;font-size:14px', text: 'Không cần mật khẩu. Chưa được cấp quyền? Liên hệ quản trị hệ thống của đơn vị.' }));
  app.appendChild(box);
  email.focus();
}
function sessionExpired(message) {
  S.token = null; store.set(null);
  document.querySelectorAll('.overlay').forEach(function (o) { o.remove(); });
  renderLogin(message || 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.');
}

/**
 * Biểu mẫu thêm/sửa. mode: 'create' | 'update' (từ hồ sơ) | 'edit-request' (sửa yêu cầu nháp/bị trả lại).
 * ctxData: hồ sơ (update) hoặc {request, data, base_version} (edit-request).
 */
function openMemberForm(mode, ctxData) {
  let type = mode === 'create' ? 'CREATE' : 'UPDATE', values = {}, title, changeId = null, baseVersion, memberId;
  if (mode === 'create') { title = 'Thêm đoàn viên mới'; }
  else if (mode === 'update') { values = ctxData; title = 'Sửa hồ sơ: ' + ctxData.full_name; baseVersion = ctxData.version; memberId = ctxData.member_id; }
  else { type = ctxData.request.request_type; values = ctxData.data; changeId = ctxData.request.change_id; baseVersion = ctxData.base_version; title = 'Sửa yêu cầu: ' + ctxData.request.summary; }
  const defs = memberDefs(type === 'CREATE' ? 'create' : 'update');
  const all = defs.basic.concat(defs.contact, defs.union, defs.more);
  const form = makeForm(all, values);
  const d = openDialog(title, { wide: true, modal: true });
  let rid = newRid();
  const moreOpen = ['member_code', 'id_type', 'id_number', 'email', 'address', 'union_position', 'note'].some(function (k) { return values[k]; });
  append(d.body, [
    type === 'UPDATE' ? alertBox('info', 'Thay đổi chỉ có hiệu lực sau khi người phê duyệt đồng ý. Muốn đổi đơn vị, hãy dùng chức năng "Chuyển sinh hoạt".') : null,
    h('fieldset', null, h('legend', { text: 'Thông tin cơ bản' }), h('div', { class: 'grid3' }, defs.basic.map(function (x) { return form.el(x.name); }))),
    h('fieldset', null, h('legend', { text: 'Thông tin liên hệ' }), h('div', { class: 'grid3' }, defs.contact.map(function (x) { return form.el(x.name); }))),
    h('fieldset', null, h('legend', { text: 'Thông tin công đoàn' }),
      mode === 'update' ? h('p', null, h('strong', { text: 'Đơn vị: ' }), values.unit_name || '') : null,
      h('div', { class: 'grid3' }, defs.union.map(function (x) { return form.el(x.name); }))),
    h('details', { class: 'more', open: moreOpen }, h('summary', { text: 'Thông tin bổ sung (mã đoàn viên, giấy tờ, email, địa chỉ, chức vụ, ghi chú)' }),
      h('div', { class: 'grid2' }, defs.more.filter(function (x) { return x.name !== 'note'; }).map(function (x) { return form.el(x.name); })), form.el('note'))
  ]);
  function send(submit, btn) {
    d.error(null); form.clearErrors();
    const data = form.get();
    if (!data.full_name) { form.showErrors({ full_name: 'Vui lòng nhập họ và tên.' }); return; }
    if (type === 'CREATE' && !data.unit_id && !changeId) { form.showErrors({ unit_id: 'Vui lòng chọn đơn vị.' }); return; }
    if (changeId && type === 'CREATE' && !data.unit_id) data.unit_id = values.unit_id;
    const payload = { request_type: type, data: data, submit: submit, change_id: changeId, member_id: memberId, base_version: baseVersion };
    busy(btn, function () {
      return call('change.save', payload, rid).then(function (r) {
        rid = newRid(); d.close(); toast(r.message); refreshBadges();
        if (S.view === 'members') go('members'); else if (S.view === 'approvals') go('approvals', 'mine');
      }).catch(function (e) {
        if (e.code !== 'NETWORK') rid = newRid();
        if (e.details) form.showErrors(e.details);
        d.error(e);
      });
    });
  }
  d.footer.appendChild(h('button', { class: 'btn', text: 'Hủy bỏ', onclick: d.close }));
  d.footer.appendChild(h('button', { class: 'btn', text: 'Lưu nháp', onclick: function (e) { send(false, e.currentTarget); } }));
  d.footer.appendChild(h('button', { class: 'btn primary', text: 'Gửi duyệt', onclick: function (e) { send(true, e.currentTarget); } }));
}

function openReasonRequest(type, m) {
  const title = type === 'ARCHIVE' ? 'Lưu trữ hồ sơ: ' + m.full_name : 'Khôi phục hồ sơ: ' + m.full_name;
  const d = openDialog(title);
  const form = makeForm([{ name: 'reason', label: 'Lý do', type: 'textarea', required: true, max: 500 }]);
  append(d.body, [alertBox('info', type === 'ARCHIVE' ? 'Hồ sơ không bị xóa mà chuyển sang trạng thái lưu trữ sau khi được duyệt.' : 'Hồ sơ sẽ có hiệu lực trở lại sau khi được duyệt.'), form.el('reason')]);
  let rid = newRid();
  d.footer.appendChild(h('button', { class: 'btn', text: 'Hủy bỏ', onclick: d.close }));
  d.footer.appendChild(h('button', { class: 'btn primary', text: 'Gửi duyệt', onclick: function (e) {
    const v = form.get();
    if (!v.reason) { form.showErrors({ reason: 'Vui lòng ghi lý do.' }); return; }
    busy(e.currentTarget, function () {
      return call('change.save', { request_type: type, member_id: m.member_id, base_version: m.version, data: { reason: v.reason }, submit: true }, rid)
        .then(function (r) { d.close(); toast(r.message); refreshBadges(); if (S.view === 'members') go('members'); })
        .catch(function (er) { if (er.code !== 'NETWORK') rid = newRid(); if (er.details) form.showErrors(er.details); d.error(er); });
    });
  } }));
}

/* ============================ PHÊ DUYỆT ============================ */
function viewApprovals(main, tab) {
  tab = tab || (S.me.canApprove ? 'approve' : 'mine');
  clear(main);
  main.appendChild(h('h1', { text: 'Chờ phê duyệt', 'data-crumb': 'Công đoàn / ' }));
  const tabs = [['approve', 'Chờ tôi duyệt', S.me.canApprove], ['mine', 'Yêu cầu tôi lập', S.me.canEdit || S.me.isAdmin], ['history', 'Lịch sử xử lý', true]];
  main.appendChild(h('div', { class: 'tabs', role: 'tablist' }, tabs.filter(function (t) { return t[2]; }).map(function (t) {
    return h('button', { role: 'tab', 'aria-selected': t[0] === tab ? 'true' : 'false', text: t[1], onclick: function () { go('approvals', t[0]); } });
  })));
  const st = h('select', { id: 'a-st' });
  [['', 'Mọi trạng thái'], ['DRAFT', 'Nháp'], ['PENDING', 'Chờ duyệt'], ['APPROVED', 'Đã duyệt'], ['RETURNED', 'Trả lại'], ['CANCELLED', 'Đã hủy']]
    .forEach(function (o) { st.appendChild(h('option', { value: o[0], text: o[1] })); });
  const q = h('input', { id: 'a-q', type: 'search', placeholder: 'Tên đoàn viên…' });
  const results = h('div');
  const selected = {};
  const bulkBtn = h('button', { class: 'btn ok', text: 'Duyệt các yêu cầu đã chọn', disabled: true });
  function updateBulk() { const n = Object.keys(selected).filter(function (k) { return selected[k]; }).length; bulkBtn.disabled = !n; bulkBtn.textContent = n ? 'Duyệt ' + n + ' yêu cầu đã chọn' : 'Duyệt các yêu cầu đã chọn'; }
  let bulkRid = newRid();
  bulkBtn.addEventListener('click', function () {
    const ids = Object.keys(selected).filter(function (k) { return selected[k]; });
    confirmDialog('Duyệt hàng loạt', 'Duyệt ' + ids.length + ' yêu cầu đã chọn? Hãy chắc chắn bạn đã xem nội dung từng yêu cầu.', 'Duyệt').then(function (yes) {
      if (!yes) return;
      busy(bulkBtn, function () {
        return call('change.approveMany', { change_ids: ids }, bulkRid).then(function (r) {
          bulkRid = newRid();
          const failed = r.results.filter(function (x) { return !x.ok; });
          toast(r.message, failed.length ? 'error' : '');
          if (failed.length) toast('Không duyệt được: ' + failed.map(function (f) { return f.message; }).join('; '), 'error');
          go('approvals', tab);
        }).catch(function (e) { toast(errorText(e), 'error'); });
      });
    });
  });
  function load(page) {
    clear(results).appendChild(h('div', { class: 'loading' }, h('span', { class: 'spinner' }), ' Đang tải…'));
    return call('change.list', { box: tab, status: st.value, q: q.value, page: page || 1, pageSize: 20 }).then(function (res) {
      clear(results);
      const headers = (tab === 'approve' ? [{ label: 'Chọn' }] : []).concat([{ label: 'Nội dung', title: true }, { label: 'Đơn vị' }, { label: 'Người lập' }, { label: 'Gửi lúc' }, { label: 'Trạng thái' }]);
      results.appendChild(table(headers, res.items.map(function (c) {
        const cells = [[c.summary, c.import_job_id ? h('span', { class: 'tag', style: 'margin-left:6px', text: 'Nhập từ tệp' }) : null], c.unit_name, c.created_by, fmtDT(c.submitted_at || c.created_at),
          [statusTag(c.status, c.status_label), c.status === 'RETURNED' && c.decision_note ? h('div', { class: 'muted', style: 'font-size:13px', text: 'Lý do: ' + c.decision_note }) : null]];
        if (tab === 'approve') cells.unshift(h('input', { type: 'checkbox', 'aria-label': 'Chọn ' + c.summary, checked: !!selected[c.change_id], onchange: function (e) { selected[c.change_id] = e.target.checked; updateBulk(); } }));
        return { onclick: function () { openRequest(c.change_id); }, cells: cells };
      }), { empty: tab === 'approve' ? 'Không có yêu cầu nào chờ bạn duyệt.' : 'Không có yêu cầu nào.' }));
      results.appendChild(pager(res, load));
    }).catch(function (e) { clear(results).appendChild(alertBox('error', errorText(e))); });
  }
  st.addEventListener('change', function () { load(1); });
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(1); });
  append(main, [h('div', { class: 'toolbar' },
    h('div', { class: 'field', style: 'flex:2 1 220px' }, h('label', { for: 'a-q', text: 'Tìm' }), q),
    tab !== 'approve' ? h('div', { class: 'field', style: 'flex:1 1 180px' }, h('label', { for: 'a-st', text: 'Trạng thái' }), st) : null,
    h('button', { class: 'btn', text: 'Tìm', onclick: function () { load(1); } }), tab === 'approve' ? bulkBtn : null), results]);
  refreshBadges();
  return load(1);
}

function openRequest(changeId) {
  const d = openDialog('Chi tiết yêu cầu', { wide: true });
  d.body.appendChild(h('div', { class: 'loading' }, h('span', { class: 'spinner' }), ' Đang tải…'));
  call('change.get', { change_id: changeId }).then(function (r) {
    const c = r.request;
    clear(d.body);
    append(d.body, [
      statusBar(c.status === 'RETURNED' ? ['DRAFT', 'RETURNED', 'PENDING', 'APPROVED'] : c.status === 'CANCELLED' ? ['DRAFT', 'PENDING', 'CANCELLED'] : ['DRAFT', 'PENDING', 'APPROVED'], c.status,
        { DRAFT: 'Nháp', PENDING: 'Chờ duyệt', APPROVED: 'Đã duyệt', RETURNED: 'Trả lại', CANCELLED: 'Đã hủy' }),
      h('p', { style: 'font-size:20px;margin:0 0 4px;color:#212529' }, h('span', { text: c.summary })),
      h('p', { class: 'muted', text: 'Đơn vị: ' + c.unit_name + ' — Người lập: ' + c.created_by + ' — ' + fmtDT(c.created_at) }),
      r.stale ? alertBox('warn', 'Hồ sơ đã thay đổi sau khi yêu cầu được lập (xung đột phiên bản). Nên trả lại để người lập cập nhật.') : null,
      c.status === 'RETURNED' ? alertBox('error', 'Bị trả lại: ' + (c.decision_note || '')) : null,
      h('h3', { text: c.request_type === 'CREATE' ? 'Thông tin đề nghị thêm mới' : 'So sánh giá trị cũ và mới' }),
      table(c.request_type === 'CREATE' ? [{ label: 'Trường' }, { label: 'Giá trị' }] : [{ label: 'Trường' }, { label: 'Giá trị cũ' }, { label: 'Giá trị mới' }],
        r.diff.filter(function (x) { return c.request_type !== 'UPDATE' || x.changed || x.old; }).map(function (x) {
          const show = function (field, v) { return /dob|join_date/.test(field) ? fmtDate(v) : v; };
          return c.request_type === 'CREATE'
            ? { cells: [x.label, show(x.field, x.new)] }
            : { cls: x.changed ? 'changed' : '', cells: [x.label, h('span', { class: x.changed ? 'diff-old' : '', text: show(x.field, x.old) || '—' }), h('span', { class: x.changed ? 'diff-new' : '', text: show(x.field, x.new) || '—' })] };
        })),
      h('h3', { text: 'Lịch sử xử lý' }),
      table([{ label: 'Thời gian' }, { label: 'Hành động' }, { label: 'Người thực hiện' }, { label: 'Ghi chú' }],
        r.actions.map(function (a) { return { cells: [fmtDT(a.at), ACTION_LABELS[a.action] || a.action, a.actor, a.note] }; }))
    ]);
    let rid = newRid();
    function act(action, payload, btn, ok) {
      d.error(null);
      return busy(btn, function () {
        return call(action, Object.assign({ change_id: changeId }, payload || {}), rid).then(function (res) {
          rid = newRid(); d.close(); toast(res.message || ok); refreshBadges(); if (S.view === 'approvals') go('approvals');
        }).catch(function (e) { if (e.code !== 'NETWORK') rid = newRid(); d.error(e); });
      });
    }
    if (r.can_cancel) d.footer.appendChild(h('button', { class: 'btn danger', text: 'Hủy yêu cầu', onclick: function (e) {
      const b = e.currentTarget; confirmDialog('Hủy yêu cầu', 'Bạn chắc chắn muốn hủy yêu cầu này?', 'Hủy yêu cầu', true).then(function (y) { if (y) act('change.cancel', {}, b); });
    } }));
    if (r.can_edit && (c.request_type === 'CREATE' || c.request_type === 'UPDATE')) d.footer.appendChild(h('button', { class: 'btn', text: 'Sửa và gửi lại', onclick: function () { d.close(); openMemberForm('edit-request', r); } }));
    if (r.can_edit && c.status === 'DRAFT') d.footer.appendChild(h('button', { class: 'btn primary', text: 'Gửi duyệt', onclick: function (e) { act('change.submit', {}, e.currentTarget); } }));
    if (r.can_approve) {
      const note = h('textarea', { id: 'ret-note', maxlength: '500', placeholder: 'Ghi rõ cần sửa gì…' });
      const retWrap = h('div', { class: 'field', hidden: true }, h('label', { for: 'ret-note', text: 'Lý do trả lại (bắt buộc)' }), note);
      d.body.appendChild(retWrap);
      d.footer.appendChild(h('button', { class: 'btn danger', text: 'Trả lại', onclick: function (e) {
        if (retWrap.hidden) { retWrap.hidden = false; note.focus(); return; }
        if (!note.value.trim()) { d.error({ message: 'Vui lòng ghi lý do trả lại.' }); note.focus(); return; }
        act('change.return', { note: note.value.trim() }, e.currentTarget);
      } }));
      d.footer.appendChild(h('button', { class: 'btn ok', text: 'Duyệt', onclick: function (e) { act('change.approve', {}, e.currentTarget); } }));
    }
    d.footer.appendChild(h('button', { class: 'btn', text: 'Đóng', onclick: d.close }));
  }).catch(function (e) { clear(d.body); d.error(e); });
}

/* ============================ CHUYỂN SINH HOẠT ============================ */
function openTransferForm(m) {
  const d = openDialog('Chuyển sinh hoạt: ' + m.full_name);
  const form = makeForm([
    { name: 'to_unit_id', label: 'Đơn vị đến', type: 'select', required: true,
      options: [['', '— Chọn đơn vị đến —']].concat(S.me.transferTargets.filter(function (u) { return u.unit_id !== m.unit_id; }).map(function (u) { return [u.unit_id, u.path]; })) },
    { name: 'proposed_date', label: 'Ngày đề nghị chuyển', type: 'date', required: true, default: todayVN() },
    { name: 'effective_date', label: 'Ngày hiệu lực (nếu đã biết)', type: 'date' },
    { name: 'reason', label: 'Lý do', type: 'textarea', required: true, max: 500 }
  ]);
  append(d.body, [alertBox('info', 'Đơn vị hiện tại: ' + m.unit_name + '. Đơn vị đến phải xác nhận thì việc chuyển mới hoàn tất. Mã đoàn viên được giữ nguyên.'),
    form.el('to_unit_id'), h('div', { class: 'grid2' }, form.el('proposed_date'), form.el('effective_date')), form.el('reason')]);
  let rid = newRid();
  d.footer.appendChild(h('button', { class: 'btn', text: 'Hủy bỏ', onclick: d.close }));
  d.footer.appendChild(h('button', { class: 'btn primary', text: 'Gửi yêu cầu chuyển', onclick: function (e) {
    const v = form.get(); v.member_id = m.member_id;
    const errs = {};
    if (!v.to_unit_id) errs.to_unit_id = 'Vui lòng chọn đơn vị đến.';
    if (!v.reason) errs.reason = 'Vui lòng ghi lý do.';
    if (Object.keys(errs).length) { form.showErrors(errs); return; }
    busy(e.currentTarget, function () {
      return call('transfer.create', v, rid).then(function (r) { d.close(); toast(r.message); })
        .catch(function (er) { if (er.code !== 'NETWORK') rid = newRid(); if (er.details) form.showErrors(er.details); d.error(er); });
    });
  } }));
}

function viewTransfers(main, tab) {
  tab = tab || 'incoming';
  clear(main);
  main.appendChild(h('h1', { text: 'Chuyển sinh hoạt', 'data-crumb': 'Công đoàn / ' }));
  main.appendChild(alertBox('info', 'Để lập yêu cầu chuyển: vào "Đoàn viên", mở hồ sơ rồi bấm "Chuyển sinh hoạt".'));
  main.appendChild(h('div', { class: 'tabs', role: 'tablist' }, [['incoming', 'Chờ đơn vị tôi xác nhận'], ['outgoing', 'Đơn vị tôi chuyển đi'], ['all', 'Tất cả']].map(function (t) {
    return h('button', { role: 'tab', 'aria-selected': t[0] === tab ? 'true' : 'false', text: t[1], onclick: function () { go('transfers', t[0]); } });
  })));
  const results = h('div');
  main.appendChild(results);
  function decide(t, kind) {
    const titles = { confirm: 'Xác nhận nhận đoàn viên', reject: 'Từ chối yêu cầu chuyển', cancel: 'Hủy yêu cầu chuyển' };
    const d = openDialog(titles[kind] + ': ' + t.member_name);
    const defs = [];
    if (kind === 'confirm') defs.push({ name: 'effective_date', label: 'Ngày hiệu lực', type: 'date', required: true, default: t.effective_date || todayVN() });
    defs.push({ name: 'note', label: kind === 'reject' ? 'Lý do từ chối' : 'Ghi chú', type: 'textarea', required: kind === 'reject', max: 500 });
    const form = makeForm(defs);
    append(d.body, [h('p', { text: 'Từ: ' + t.from_unit }), h('p', { text: 'Đến: ' + t.to_unit }), h('p', { text: 'Lý do chuyển: ' + t.reason }), defs.map(function (x) { return form.el(x.name); })]);
    let rid = newRid();
    d.footer.appendChild(h('button', { class: 'btn', text: 'Đóng', onclick: d.close }));
    d.footer.appendChild(h('button', { class: 'btn ' + (kind === 'confirm' ? 'ok' : 'danger'), text: titles[kind], onclick: function (e) {
      const v = form.get(); v.transfer_id = t.transfer_id;
      if (kind === 'reject' && !v.note) { form.showErrors({ note: 'Vui lòng ghi lý do.' }); return; }
      busy(e.currentTarget, function () {
        return call('transfer.' + kind, v, rid).then(function (r) { d.close(); toast(r.message); refreshBadges(); go('transfers', tab); })
          .catch(function (er) { if (er.code !== 'NETWORK') rid = newRid(); if (er.details) form.showErrors(er.details); d.error(er); });
      });
    } }));
  }
  function load(page) {
    clear(results).appendChild(h('div', { class: 'loading' }, h('span', { class: 'spinner' }), ' Đang tải…'));
    return call('transfer.list', { box: tab, page: page || 1, pageSize: 20 }).then(function (res) {
      clear(results);
      results.appendChild(table([{ label: 'Đoàn viên', title: true }, { label: 'Từ đơn vị' }, { label: 'Đến đơn vị' }, { label: 'Ngày đề nghị' }, { label: 'Trạng thái' }, { label: 'Thao tác' }],
        res.items.map(function (t) {
          return { cells: [t.member_name + (t.member_code ? ' (' + t.member_code + ')' : ''), t.from_unit, t.to_unit, fmtDate(t.proposed_date),
            [statusTag(t.status, t.status_label), t.decision_note ? h('div', { class: 'muted', style: 'font-size:13px', text: t.decision_note }) : null],
            h('div', { class: 'row' },
              t.can_confirm ? h('button', { class: 'btn small ok', text: 'Xác nhận', onclick: function () { decide(t, 'confirm'); } }) : null,
              t.can_confirm ? h('button', { class: 'btn small danger', text: 'Từ chối', onclick: function () { decide(t, 'reject'); } }) : null,
              t.can_cancel ? h('button', { class: 'btn small', text: 'Hủy', onclick: function () { decide(t, 'cancel'); } }) : null)] };
        }), { empty: tab === 'incoming' ? 'Không có yêu cầu chuyển đến nào chờ xác nhận.' : 'Không có yêu cầu nào.' }));
      results.appendChild(pager(res, load));
    }).catch(function (e) { clear(results).appendChild(alertBox('error', errorText(e))); });
  }
  return load(1);
}

/* ============================ ĐOÀN PHÍ ============================ */
const DQ = { year: Number(todayVN().substring(0, 4)), month: Number(todayVN().substring(5, 7)), unit_id: '', state: '', q: '', page: 1 };
function periodOf(y, m) { return y + '-' + (m < 10 ? '0' : '') + m; }
function periodSelects(idp, y, m) {
  const ms = h('select', { id: idp + '-m', 'aria-label': 'Tháng' });
  for (let i = 1; i <= 12; i++) ms.appendChild(h('option', { value: i, text: 'Tháng ' + i }));
  ms.value = m;
